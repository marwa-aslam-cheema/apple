<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline - Lucky Arena</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 0,#4a0b26,#0a0509 70%);color:#fff4e0;font-family:ui-rounded,"Segoe UI",system-ui,sans-serif;text-align:center;padding:24px}
  h1{font-family:Georgia,serif;font-size:2.2rem;margin:.4em 0;color:#ffcf4a;text-transform:uppercase}
  p{color:#c4aa9a;max-width:22rem;margin:0 auto 1.4rem}
  button{background:linear-gradient(#ffe58f,#f7bd1c 55%,#d38f08);color:#2a1700;border:0;border-radius:12px;padding:.8rem 1.6rem;font-weight:800;font-size:1rem}
</style>
</head>
<body>
  <main>
    <div style="font-size:3.4rem" aria-hidden="true">🎰</div>
    <h1>You are offline</h1>
    <p>Lucky Arena needs the internet to spin the wheel. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
